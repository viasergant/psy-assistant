spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    clean-disabled: true
    locations: classpath:db/migration
    ignore-migration-patterns: "repeatable:missing"  # dev seed was applied to prod DB; ignore orphaned repeatable migrations

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      data-source-properties:
        # TLS to Postgres (docs/adr/002-encryption-at-rest.md). Use verify-full with DB_SSLROOTCERT in the cloud.
        sslmode: ${DB_SSLMODE:require}
        sslrootcert: ${DB_SSLROOTCERT:}

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

management:
  endpoint:
    health:
      show-details: when-authorized
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
logging:
  level:
    root: WARN
    com.psyassistant: INFO

notifications:
  telegram:
    enabled: true
    mode: polling   # long polling; works without a public webhook URL

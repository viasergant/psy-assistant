<div class="settings-container">
  <div class="settings-header">
    <h1>{{ 'settings.title' | transloco }}</h1>
  </div>

  <div class="settings-content">
    <section class="settings-section">
      <h2 class="section-title">{{ 'settings.language.title' | transloco }}</h2>
      <p class="section-description">{{ 'settings.language.description' | transloco }}</p>

      <select
        class="language-select"
        (change)="selectLanguage($any($event.target).value)"
        [attr.aria-label]="'settings.language.title' | transloco"
      >
        @for (lang of languages; track lang.code) {
          <option [value]="lang.code" [selected]="lang.code === currentLocale()">{{ lang.labelKey | transloco }}</option>
        }
      </select>

      <div class="section-actions">
        <button
          type="button"
          class="btn-primary"
          (click)="saveLanguage()"
          [disabled]="saving()"
          [attr.aria-busy]="saving()"
        >
          @if (saving()) {
            {{ 'settings.language.saving' | transloco }}
          } @else {
            {{ 'settings.language.save' | transloco }}
          }
        </button>

        @if (saved()) {
          <span class="save-confirmation" role="status">
            {{ 'settings.language.saved' | transloco }}
          </span>
        }
      </div>
    </section>

    @if (canUseTelegram()) {
      <app-telegram-settings />
    }
  </div>
</div>
